<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnoTech Career Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🤖 InnoTech Career Assistant</h1>
            <p class="subtitle">AI-powered career guidance</p>
        </header>

        <main id="chat-box" class="chat-box">
            <div class="message bot">
                <div class="bubble">👋 Hi! I'm your career assistant. Tell me about your interests, skills, or subjects you like.</div>
            </div>
        </main>

        <div class="input-area">
            <input id="user-input" type="text" placeholder="Type your message..." autocomplete="off" />
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
